[package]
name = "tutoro"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
# derive_more = "2.0.1"
google-cloud-auth = "0.19.0"
ollama-rs = "0.3.0"
reqwest = { version = "0.12.15", features = ["json"] }
serenity = "0.12.4"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }

google-cloud-api = "0.2"          # underlying Google Cloud transport
google-cloud-aiplatform-v1 = "0.2.0"
google-genai = "0.0.2"
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
